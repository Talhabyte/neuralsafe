name: neuralsafe
description: "NeuralSafe - Stealth safety application (calculator disguise)"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Phase 2: local encrypted storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # Phase 3: behavioral data collection
  permission_handler: ^11.3.1
  geolocator: ^12.0.0

  # Phase 4/5: on-device AI inference (added when we get there)
  # tflite_flutter: ^0.10.4

  # Phase 7: alerts
  # telephony: ^0.2.0   # SMS sending (Android only - added in Phase 7)

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

